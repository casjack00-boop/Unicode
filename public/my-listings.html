<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Listings | UniMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap">
  <link rel="stylesheet" href="/post.css">
  <script src="/my-listings.js" defer></script>
  <link rel="stylesheet" href="/accessibility.css">
  <link rel="stylesheet" href="/seller-tools.css">
  <script src="/accessibility.js"></script>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#002D72">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/pwa.css">
  <script src="/pwa.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="bar">
      <a href="/browse.html" class="icon-btn" aria-label="Back to Browse">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#002D72" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <h1>My listings</h1>
    </header>

    <main class="mine">
      <div class="mine-top">
        <p>Manage the items you've posted. <a href="/transactions.html">Offers &amp; transactions</a></p>
        <a href="/post.html" class="sell-link">+ Sell</a>
      </div>
      <p id="message" class="message" role="status" aria-live="polite"></p>
      <section id="seller-summary" class="seller-panel" aria-labelledby="seller-summary-heading" hidden>
        <h2 id="seller-summary-heading">Listing overview</h2>
        <dl class="seller-dimensions" id="seller-summary-values"></dl>
        <p class="hint">Asking value is not revenue or completed payments.</p>
        <label for="listing-status-filter">Show listings</label>
        <select id="listing-status-filter"><option value="all">All listings</option><option value="active">For sale</option><option value="reserved">Reserved</option><option value="sold">Sold</option></select>
      </section>
      <div id="listings"><p class="empty">Loading your listings...</p></div>
    </main>
  </div>
</body>
</html>
