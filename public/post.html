<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sell an Item | UniMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap">
  <link rel="stylesheet" href="/post.css">
  <link rel="stylesheet" href="/isbn.css">
  <link rel="stylesheet" href="/isbn-scanner.css">

  <script src="/post.js" defer></script>
  <script src="/isbn.js" defer></script>
  <script src="/vendor/quagga.min.js" defer></script>
  <script src="/isbn-scanner.js" defer></script>
  <link rel="stylesheet" href="/accessibility.css">
  <script src="/accessibility.js"></script>
</head>
<body>
  <div class="app">

    <!-- Top bar: close (X) + title -->
    <header class="bar">
      <a href="/browse.html" class="icon-btn" aria-label="Cancel">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#002D72" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
      <h1>Sell an item</h1>
      <a href="/my-listings.html" class="bar-link">My listings</a>
    </header>

    <!-- Shown when not logged in -->
    <div id="loginNote" class="notice" hidden>
      Please <a href="/login.html">log in</a> with your UT Tyler email to sell an item.
    </div>

    <main>
    <form id="postForm" class="form" novalidate>

      <!-- Photos -->
      <div class="field">
        <span class="label">Photos <span class="hint">(up to 3)</span></span>
        <div class="photos" id="photoSlots">
          <button type="button" class="add-photo" id="initialAddPhoto">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#B4500C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
            Add photo
          </button>
          <div class="slot"></div>
          <div class="slot"></div>
        </div>
        <input type="file" id="photoInput" accept="image/jpeg,image/png,image/webp" multiple hidden>
        <span class="hint">JPG, PNG, or WEBP, up to 5 MB each.</span>
      </div>

      <!-- Title -->
      <div class="field">
        <label for="title" class="label">Title</label>
        <input id="title" type="text" maxlength="80" placeholder="What are you selling?" required>
      </div>

      <!-- Price + Category side by side -->
      <div class="two">
        <div class="field">
          <label for="price" class="label">Price</label>
          <div class="money">
            <span aria-hidden="true">$</span>
            <input id="price" type="number" inputmode="decimal" min="0" max="10000" step="0.01" placeholder="0" required>
          </div>
        </div>
        <div class="field">
          <label for="category" class="label">Category</label>
          <select id="category" required>
            <option value="">Choose one</option>
            <option value="textbooks">Textbooks</option>
            <option value="furniture">Furniture</option>
            <option value="dorm">Dorm</option>
            <option value="electronics">Electronics</option>
            <option value="clothing">Clothing</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <!-- Textbook details (only for Textbooks) -->
      <div id="bookFields" class="book" hidden>
        <div class="two">
          <div class="field">
            <label for="department" class="label">Department</label>
            <input id="department" type="text" maxlength="20" placeholder="e.g. CHEM">
          </div>
          <div class="field">
            <label for="courseNumber" class="label">Course number</label>
            <input id="courseNumber" type="text" maxlength="20" placeholder="e.g. 2323">
          </div>
        </div>
        <div class="two">
          <div class="field">
            <label for="edition" class="label">Edition</label>
            <input id="edition" type="text" maxlength="30" placeholder="e.g. 9th">
          </div>
          <div class="field">
            <label for="author" class="label">Author</label>
            <input id="author" type="text" maxlength="80" placeholder="Last name">
          </div>
        </div>
      </div>

      <!-- Condition chips -->
      <fieldset class="field">
        <legend class="label">Condition</legend>
        <div class="chips" id="conditionChips">
          <button type="button" class="chip" data-value="new" aria-pressed="false">New</button>
          <button type="button" class="chip" data-value="like_new" aria-pressed="false">Like new</button>
          <button type="button" class="chip active" data-value="good" aria-pressed="true">Good</button>
          <button type="button" class="chip" data-value="fair" aria-pressed="false">Fair</button>
        </div>
      </fieldset>

      <!-- Description -->
      <div class="field">
        <label for="description" class="label">Description</label>
        <textarea id="description" rows="4" maxlength="1000" placeholder="Size, how long you've had it, any wear or damage"></textarea>
      </div>

      <!-- Meeting spot -->
      <div class="field">
        <label for="meetingSpot" class="label">Where can you meet?</label>
        <select id="meetingSpot" required>
          <option value="">Pick a suggested campus spot</option>
          <option>Robert R. Muntz Library, front entrance</option>
          <option>University Center entrance</option>
          <option>Herrington Patriot Center lobby</option>
          <option>Ornelas Student Center</option>
        </select>
      </div>

    </form>
    </main>

    <!-- Sticky bottom bar -->
    <div class="actions">
      <p id="message" class="message" role="status" aria-live="polite"></p>
      <button type="submit" form="postForm" id="postBtn" class="post-btn">Post listing</button>
    </div>
  </div>
</body>
</html>
