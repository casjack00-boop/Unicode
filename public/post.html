
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post an Item | UniMarket</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="post.css">
    <script src="post.js" defer></script>
</head>
<body>
    <header>
        <h1>UniMarket</h1>
        <p>Buy and Sell with UT Tyler Students</p>
    </header>

    <main>
        <h2>Post an Item</h2>
        <p>Fill out the form to sell your item.</p>

        <form id="postForm">
            <label for="title">Item Title</label>
            <input type="text" id="title" required>

            <label for="price">Price ($)</label>
            <input type="number" id="price" min="0" step="0.01" required>

            <label for="category">Category</label>
            <select id="category" required>
                <option value="">Select a Category</option>
                <option value="textbooks">Textbooks</option>
                <option value="furniture">Furniture</option>
                <option value="dorm">Dorm</option>
                <option value="electronics">Electronics</option>
                <option value="clothing">Clothing</option>
                <option value="other">Other</option>
            </select>

            <label for="condition">Condition</label>
            <select id="condition" required>
                <option value="">Select Condition</option>
                <option value="new">New</option>
                <option value="like_new">Like New</option>
                <option value="good">Good</option>
                <option value="fair">Fair</option>
            </select>

            <label for="description">Description</label>
            <textarea id="description" required></textarea>

            <label for="meetingSpot">Campus Meeting Spot</label>
            <select id="meetingSpot" required>
                <option value="">Select Meeting Spot</option>
                <option value="Student Center">Student Center</option>
                <option value="Library">Library</option>
                <option value="University Center">University Center</option>
            </select>

            <p id="message" role="status" aria-live="polite"></p>
            <button type="submit">Post Item</button>
        </form>
    </main>
</body>
</html>
