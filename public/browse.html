<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse | UniMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap">
  <link rel="stylesheet" href="/browse.css">
  <script src="/discovery.js" defer></script>
  <script src="/browse.js" defer></script>
  <link rel="stylesheet" href="/accessibility.css">
  <link rel="stylesheet" href="/discovery.css">
  <script src="/accessibility.js"></script>
  <link rel="stylesheet" href="/notifications.css">
  <script src="/notifications.js" defer></script>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#002D72">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/pwa.css">
  <script src="/pwa.js" defer></script>
</head>
<body>
  <div class="app">
    <!-- Navy header: logo, verified badge, search -->
    <header class="top">
      <div class="top-row">
        <a href="/" class="brand">UniMarket</a>
                <a href="/roommates.html" class="roommates-link">Find a roommate</a>
        <span class="verified">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F47A20" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
          Verified students
        </span>
      </div>
      <div class="search-row">
        <div class="search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A6478" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          <label for="searchInput" class="sr-only">Search listings</label>
          <input id="searchInput" type="search" placeholder="Search by title, ISBN, or item">
        </div>
        <a class="notice-link notice-icon" data-notice-link href="/notifications.html" aria-label="Notifications" title="Notifications" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span hidden aria-hidden="true"></span></a>
      </div>
    </header>

    <!-- Category chips -->
    <nav class="chips" aria-label="Item categories">
      <button class="chip active" data-category="all" type="button" aria-pressed="true">All</button>
      <button class="chip" data-category="textbooks" type="button" aria-pressed="false">Textbooks</button>
      <button class="chip" data-category="furniture" type="button" aria-pressed="false">Furniture</button>
      <button class="chip" data-category="dorm" type="button" aria-pressed="false">Dorm</button>
      <button class="chip" data-category="electronics" type="button" aria-pressed="false">Electronics</button>
      <button class="chip" data-category="clothing" type="button" aria-pressed="false">Clothing</button>
      <button class="chip" data-category="other" type="button" aria-pressed="false">Other</button>
    </nav>

    <main class="content">
      <button id="save-search-alert" type="button" class="discovery-button">Save search alert</button>
      <div class="discovery-links"><a class="discovery-link" href="/saved.html">Saved &amp; recently viewed</a><a class="discovery-link" href="/academic.html">Textbook requests &amp; discovery</a></div>
      <div class="toolbar">
        <div class="result-tools"><span id="resultCount" role="status">Loading...</span>
          <button id="filterToggle" class="filter-btn" type="button" aria-label="Filters" aria-controls="filters" aria-expanded="false">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
        </button></div>
        <label class="sort">Sort
          <select id="sortSelect">
            <option value="recommended">Best match</option>
            <option value="newest">Newest</option>
            <option value="price_asc">Price: low to high</option>
            <option value="price_desc">Price: high to low</option>
          </select>
        </label>
      </div>

      <!-- Filters panel (opens from the filter button) -->
      <section id="filters" class="filters" hidden>
        <div id="textbookFilters" class="filter-grid" hidden>
          <label>Department
            <select id="department"><option value="">All departments</option></select>
          </label>
          <label>Course number
            <select id="course"><option value="">All courses</option></select>
          </label>
          <label>Edition
            <select id="edition"><option value="">All editions</option></select>
          </label>
        </div>
        <div class="filter-grid">
          <label>Min price ($)
            <input id="minPrice" type="number" min="0" step="0.01" inputmode="decimal">
          </label>
          <label>Max price ($)
            <input id="maxPrice" type="number" min="0" step="0.01" inputmode="decimal">
          </label>
        </div>
        <div class="filter-grid">
          <label>Condition
            <select id="conditionFilter"><option value="">Any condition</option><option value="new">New</option><option value="like_new">Like new</option><option value="good">Good</option><option value="fair">Fair</option></select>
          </label>
          <label>Seller housing
            <select id="housingFilter"><option value="">Any housing</option><option value="on_campus">On campus</option><option value="off_campus">Off campus</option></select>
          </label>
        </div>
        <button id="clearFilters" class="clear-btn" type="button">Clear filters</button>
      </section>

      <section id="personal-recommendations" class="discovery-section" aria-labelledby="personal-heading" hidden>
        <h2 id="personal-heading">Recommended for you</h2>
        <p id="personal-status" role="status"></p>
        <div id="personal-list" class="discovery-list"></div>
        <a href="/settings.html?from=browse#personalisation" class="discovery-link">Manage recommendation privacy</a>
      </section>
      <p id="browse-save-status" class="discovery-status" role="status"></p>
      <div id="listingResults" class="grid"></div>
      <p id="errorMessage" class="error" role="alert" hidden></p>
    </main>

    <!-- Bottom navigation -->
    <nav class="bottom-nav" aria-label="Main">
      <a href="/browse.html" aria-current="page" class="nav-item active">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
        Browse
      </a>
      <a href="/post.html" class="nav-item">
        <span class="sell-dot">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14213D" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        </span>
        Sell
      </a>
      <a href="/messages.html" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>
        Messages
      </a>
      <a href="/profile.html" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
        Profile
      </a>
    </nav>
  </div>
</body>
</html>
